<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radar de Ataque às Vagas</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<div class="container">

<h1>Radar de ataque às vagas</h1>

<p class="subtitle">
Responda às perguntas abaixo para avaliar a intensidade da sua estratégia de candidatura de acordo com os métodos do PRH.
</p>

<div class="accordion">

<!-- ETAPA 1 -->
<div class="card disabled">
<button class="accordion-header">
Inscrição em vagas
<span class="badge">Em breve</span>
<i class="bi bi-lock"></i>
</button>

</div>


<!-- ETAPA 2 -->
<div class="card disabled">
<button class="accordion-header">
Gerenciamento de vagas
<span class="badge">Em breve</span>
<i class="bi bi-lock"></i>
</button>

</div>


<!-- ETAPA 3 -->
<div class="card">
<button class="accordion-header">
Networking e indicação
<i class="bi bi-chevron-down"></i>
</button>

<div class="accordion-content active">

<label>
<input type="checkbox" data-recomendacao="Deixe seu perfil do LinkedIn completo e estruturado para contar sua história profissional.">
Meu perfil do LinkedIn está completo e contando minha história profissional.
</label>

<label>
<input type="checkbox" data-recomendacao="Conecte-se com no mínimo 2 recrutadores de cada empresa ou vaga.">
Para cada vaga/empresa estou me conectando com no mínimo 2 recrutadores.
</label>

<label>
<input type="checkbox" data-recomendacao="Conecte-se com no mínimo 3 gestores da área de cada empresa ou vaga.">
Para cada vaga/empresa estou me conectando com no mínimo 3 gestores da área.
</label>

<label>
<input type="checkbox" data-recomendacao="Conecte-se com no mínimo 5 possíveis colegas de equipe de cada empresa ou vaga.">
Para cada vaga/empresa estou me conectando com no mínimo 5 possíveis colegas de equipe.
</label>

<label>
<input type="checkbox" data-recomendacao="Sempre que possível envie uma nota personalizada ao solicitar conexão.">
Sempre que possível envio uma nota personalizada ao solicitar conexão.
</label>

<label>
<input type="checkbox" data-recomendacao="Ao enviar mensagens para recrutadores, busque antecipar e quebrar possíveis objeções sobre seu perfil.">
Quando envio mensagem para recrutadores busco quebrar possíveis objeções do meu perfil.
</label>
</div>
</div>

<!-- ETAPA 4 -->
<div class="card disabled">
<button class="accordion-header">
Feedback dos processos
<span class="badge">Em breve</span>
<i class="bi bi-lock"></i>
</button>


</div>



<!-- ETAPA 5 -->
<div class="card disabled">
<button class="accordion-header">
Convite para entrevista
<span class="badge">Em breve</span>
<i class="bi bi-lock"></i>
</button>

</div>


<div class="buttons">

    <button class="btn-secondary">Limpar</button>

    <button class="btn-primary">Calcular meu radar</button>

</div>

<div id="resultado"></div>

</div>

<script>

// ---------- ACORDEON ----------
const headers = document.querySelectorAll(".accordion-header");

headers.forEach(header => {
header.addEventListener("click", () => {
const content = header.nextElementSibling;
content.classList.toggle("active");
});
});


// ---------- BOTÃO LIMPAR ----------

const limparBtn = document.querySelector(".btn-secondary");

limparBtn.addEventListener("click", () => {

const checkboxes = document.querySelectorAll("input[type='checkbox']");
checkboxes.forEach(cb => cb.checked = false);

document.getElementById("resultado").innerHTML = "";

window.scrollTo({
top:0,
behavior:"smooth"
});

});



const recomendacoesFixas = {
1: [
"Confira se você está cadastrado em todas as principais plataformas de vagas.",
`Se candidate em vagas publicadas há pouco tempo:<br>
1. Pesquise a vaga desejada no LinkedIn<br>
2. Aplique o filtro “Últimas 24 horas”<br>
3. Na URL, localize o trecho f_TPR=r86400 (24h em segundos) e substitua pelo tempo desejado: 3600 = 1 hora, 10800 = 3 horas.`
],

2: [
"Deve cobrar retorno de vaga quente depois de 5 dias úteis."
],

3: [
"Comente publicações de pessoas estratégicas da sua área para aumentar sua visibilidade."
],

4: [
"Cobre sempre o RH. Caso perceba que outra pessoa é responsável, concentre o contato nela.",
"Nem sempre o feedback virá. Mas pedir feedback é a única forma de tentar obter um retorno mais aprofundado.",
"Caso não receba resposta, revise as aulas e faça autoavaliação do processo.",
"Em etapas de triagem, pode cobrar retorno com 10 dias úteis se tiver conexão com alguém da empresa."
],

5: [
"Ao enviar disponibilidade para entrevista: sugira APENAS 3 horários em turnos diferentes, em datas próximas ao dia em que recebeu o contato. Isso gera gatilho da escassez."
]
};


// ---------- CALCULAR RADAR ----------

const calcularBtn = document.querySelector(".btn-primary");

calcularBtn.addEventListener("click", () => {

const etapas = document.querySelectorAll(".card:not(.disabled)");

let resultadoHTML = "";

let totalChecks = 0;
let totalMarcados = 0;




const calcularBtn = document.querySelector(".btn-primary");

calcularBtn.addEventListener("click", () => {
    // Desabilitar botão e mostrar carregando
    calcularBtn.disabled = true;
    const textoOriginal = calcularBtn.textContent;
    calcularBtn.textContent = "Calculando...";

    setTimeout(() => {
        // Aqui entra todo o código que você já tem para calcular o radar
        calcularRadar(); // vou supor que você coloque todo seu código atual numa função calcularRadar()

        // Depois que processar:
        calcularBtn.textContent = textoOriginal;
        calcularBtn.disabled = false;
    }, 100); // delay pequeno pra dar tempo do navegador atualizar o botão
});



// ---------- PERFIL ----------

etapas.forEach(etapa => {

const checkboxes = etapa.querySelectorAll("input[type='checkbox']");
const marcados = etapa.querySelectorAll("input[type='checkbox']:checked");

totalChecks += checkboxes.length;
totalMarcados += marcados.length;

});

const scoreGeral = Math.round((totalMarcados / totalChecks) * 100);

let perfilNome = "";
let perfilCor = "";
let perfilBg = "";

if(scoreGeral <= 49){
perfilNome = "Candidato invisível";
perfilCor = "#7a7a7a";
perfilBg = "#e1e1e1";
}

else if(scoreGeral <= 70){
perfilNome = "Candidato em desenvolvimento";
perfilCor = "#ca8300";
perfilBg = "#fff4e5";
}

else{
perfilNome = "Futuro dedicado especialista";
perfilCor = "green";
perfilBg = "#e8f8ee";
}


// ---------- PERFIL HTML ----------

resultadoHTML += `
<div class="perfil" style="background:${perfilBg};">
<p style="text-align:center;font-size:14px;color:#848484;padding-bottom:0px">Perfil geral</p>
<h2 style="text-align:center;color:${perfilCor};">${perfilNome}</h2>
</div>
`;


// ---------- RESULTADO POR ETAPA ----------

etapas.forEach((etapa, index) => {

const titulo = etapa.querySelector(".accordion-header").childNodes[0].textContent.trim();

const checkboxes = etapa.querySelectorAll("input[type='checkbox']");
const marcados = etapa.querySelectorAll("input[type='checkbox']:checked");

const score = Math.round((marcados.length / checkboxes.length) * 100);


let corScoreClasse = ""; // substitui corScore

if(score <= 49){
  corScoreClasse = "score-red";
}
else if(score <= 70){
  corScoreClasse = "score-orange";
}
else{
  corScoreClasse = "score-green";
}

let classeCard = "";

if(score === 100){
classeCard = "card-sucesso";
}

else if(score >= 50 && score <= 70){  // faixa laranja
  classeCard = "card-atencao";      // cria uma nova classe
}


let recomendacoes = "";
let temPendencias = false;

checkboxes.forEach(cb => {
  if (!cb.checked) {
    recomendacoes += `<li>${cb.dataset.recomendacao}</li>`;
    temPendencias = true;
  }
});

// recomendações fixas (sempre aparecem)
recomendacoesFixas[index + 1].forEach(rec=>{
  recomendacoes += `<li>${rec}</li>`;
});






resultadoHTML += `
<div class="resultado-card ${classeCard}">

<div class="resultado-header">

<h3>${titulo}</h3>
<span class="score ${corScoreClasse}">${score}%</span>

</div>

${!temPendencias ? "<p><strong>Excelente! Continue assim.</strong></p>" : ""}

<h4>Recomendações:</h4>

<ul>
${recomendacoes}
</ul>

</div>

`;

});


// ---------- DESTAQUES FINAIS ----------

resultadoHTML += `

<div class="destaques">


<div class="destaques-grid">
<div class="destaque-group">

<div class="destaque-item">
<i class="bi bi-chat-dots-fill" style="font-size:28px;color:#5C338E;"></i> <br>
Não se sinta desconfortável enviando mensagens no LinkedIn. Lembre-se: o não você já tem.
</div>

<div class="destaque-item">
<i class="bi bi-person-raised-hand" style="font-size:28px;color:#5C338E;" ></i> <br>
Nem sempre as pessoas respondem no LinkedIn. Isso é normal. O objetivo do networking também é gerar visitas no seu perfil.
</div>
</div>
</div>



</div>
<button class="refazer">Preencher radar novamente</button>
`;


document.getElementById("resultado").innerHTML = resultadoHTML;


// ---------- SCROLL PARA RESULTADO ----------

document.getElementById("resultado").scrollIntoView({
behavior:"smooth"
});


// ---------- BOTÃO REFAZER ----------

document.querySelector(".refazer").addEventListener("click", () => {

const checkboxes = document.querySelectorAll("input[type='checkbox']");
checkboxes.forEach(cb => cb.checked = false);

document.getElementById("resultado").innerHTML = "";

window.scrollTo({
top:0,
behavior:"smooth"
});

});


});

</script>

</body>
</html>
